<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>亡国の王女</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: one compact phone screen — status strip, omen matrix, familiar rows, egg buttons, revenge line, toolbar; details open in sheets. Single dark look by choice. */
:root {
  --ink: #120e16;
  --panel: #1b1620;
  --panel2: #241d2a;
  --line: #3a3042;
  --text: #ece4d6;
  --muted: #a39aa8;
  --brass: #cfa95f;
  --brass-dim: #8a713f;
  --gain: #7fc2a0;
  --loss: #e0646f;
  --hidden: #8e9fc6;
  --feed: var(--gain);
  --s-war: #f08a4b;
  --s-plague: #a6c449;
  --s-life: #ead06a;
  --s-power: #b293ee;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.5; padding-inline: 12px; padding-block: 8px 84px; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; }
h2 { font-size: .95rem; letter-spacing: .08em; color: var(--brass); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin-bottom: 5px; }
h2 small { font-family: var(--f-body); font-size: .68rem; color: var(--muted); letter-spacing: 0; font-weight: 400; flex: 1 1 12em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 10px 14px; font-size: .92rem; min-height: 44px; }
.btn.primary.feed-fill { background: var(--feed); border-color: var(--feed); color: #0b1a12; }
.btn.primary.danger-fill { background: var(--loss); border-color: var(--loss); color: #1a0a0c; }
.sheet-actions { display: grid !important; grid-template-columns: 1fr 2fr; gap: 8px; }
.sheet-actions .btn { padding: 14px; font-size: 1rem; font-weight: 700; }
.btn:hover:not(:disabled) { border-color: var(--brass-dim); }
.btn.primary { background: var(--brass); color: #1a1208; border-color: var(--brass); font-weight: 700; }
.btn.danger { border-color: #6b3238; color: var(--loss); }
.sub { font-size: .72rem; color: var(--muted); }
.up { color: var(--gain); } .dn { color: var(--loss); }
.s-war { color: var(--s-war); } .s-plague { color: var(--s-plague); } .s-life { color: var(--s-life); } .s-power { color: var(--s-power); }

/* status */
.top { display: flex; flex-direction: column; gap: 4px; }
.title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.title-row h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: .12em; }
.night { font-family: var(--f-display); color: var(--muted); font-size: .9rem; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stat { border-top: 1px solid var(--line); padding-top: 2px; min-width: 0; }
.stat .k { font-size: .62rem; color: var(--muted); }
.stat .v { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
.stat .s { font-size: .62rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.health { font-family: var(--f-display); font-size: .82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--brass-dim); display: block; }
.pips i.on { background: var(--brass); border-color: var(--brass); }
.pips.low i.on { background: var(--loss); border-color: var(--loss); }
.margin-warn { color: var(--loss); font-size: .72rem; font-family: var(--f-body); }

/* omen matrix */
.omtable { overflow-x: clip; display: flex; flex-direction: column; gap: 3px; }
.om-row { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(4, minmax(0, 1fr)); gap: 3px; will-change: auto; }
.om-h { font-family: var(--f-display); font-weight: 800; text-align: center; font-size: .95rem; line-height: 1.1; padding-bottom: 2px; border-bottom: 2px solid currentColor; }
.om-h small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .58rem; opacity: .85; }
.om-name { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; display: flex; flex-direction: column; justify-content: center; min-width: 0; position: relative; }
.om-name .nm { font-family: var(--f-display); font-weight: 700; font-size: .78rem; line-height: 1.2; display: flex; gap: 4px; align-items: baseline; }
.om-name .ix { color: var(--muted); font-family: var(--f-body); font-size: .64rem; }
.om-name small { font-size: .58rem; color: var(--muted); line-height: 1.2; }
.om-name.exo { border-color: #6a2d35; }
.om-name.hid, .om-hid { background: repeating-linear-gradient(135deg, #1a1830 0 6px, #16142a 6px 12px); border: 1px solid #34385a; color: var(--hidden); }
.om-hid { grid-column: span 4; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 3px 6px; font-size: .7rem; }
.om-hid .btn { padding: 2px 10px; font-size: .74rem; min-height: 28px; }
/* 行の帯：マスはすべて同じ色、行の後ろの背景だけ交互に変える */
.omtable { gap: 9px; }
.om-row { border-radius: 6px; }
.om-row.enter { animation: omenIn .6s cubic-bezier(.2,.8,.2,1) both; }
.om-row.enter { animation: omenIn .6s cubic-bezier(.2,.8,.2,1) both, omenGlow 2.4s ease-out .3s; }
.om-row.leave { animation: omenOut .75s cubic-bezier(.5,0,.8,.4) forwards; }
.om-row.leave { box-shadow: 0 0 0 2px var(--brass), 0 0 16px var(--brass); }
@keyframes omenOut { 0% { transform: none; opacity: 1; } 30% { transform: translateX(-6px); opacity: 1; } 100% { transform: translateX(110%); opacity: 0; } }
@keyframes omenIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes omenGlow { 0% { box-shadow: 0 0 0 2px var(--brass), 0 0 18px var(--brass); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .om-row.enter, .om-row.enter .om-name, .om-row.leave { animation: none; } }
.om-corner { font-family: var(--f-display); font-size: .8rem; color: var(--brass); display: flex; align-items: flex-end; justify-content: flex-end; gap: 4px; padding: 0 2px 6px 0; white-space: nowrap; }
.om-corner::after { content: '▶'; font-size: .6rem; color: var(--brass-dim); margin-bottom: 2px; }
.new { position: absolute; top: -5px; right: 3px; font-size: .55rem; background: var(--brass); color: #1a1208; padding: 0 4px; border-radius: 3px; line-height: 1.4; }
.cell { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; min-height: 34px; display: flex; flex-direction: column; overflow: hidden; }

.cell .half { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
.cell .half + .half { border-top: 1px dashed var(--line); }
.cell .zero { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); }
.cell .b { position: absolute; top: 16%; bottom: 16%; border-radius: 2px; }
.cell .b.pos { background: color-mix(in srgb, var(--gain) 45%, transparent); }
.cell .b.neg { background: color-mix(in srgb, var(--loss) 50%, transparent); }
.cell .v { position: relative; font-size: .68rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.cell .v.pos { color: var(--gain); } .cell .v.neg { color: var(--loss); }
.cell .v.k::before { content: '騎'; font-weight: 400; font-size: .56rem; margin-right: 1px; color: var(--loss); }
.omen-note { font-size: .66rem; color: var(--muted); margin-top: 3px; }

/* familiars: one row each */
.famlist { display: flex; flex-direction: column; gap: 4px; }
.famrow { display: grid; grid-template-columns: minmax(3.2em, auto) minmax(0, 1fr) auto minmax(5.6em, auto); gap: 6px; align-items: center; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; }
.famrow:hover { border-color: var(--brass-dim); }
.famrow.empty { display: block; width: 100%; cursor: pointer; border-style: dashed; color: var(--muted); font-size: .76rem; text-align: center; padding: 8px; cursor: default; }
.famrow.danger { border-color: #7a3039; }
.famrow .nm { font-family: var(--f-display); font-weight: 800; font-size: .98rem; line-height: 1.15; }
.famrow .meta { font-size: .6rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.famrow .val { text-align: right; line-height: 1.15; }
.famaff { justify-content: center; flex-direction: column; align-items: center; gap: 0 !important; font-size: .7rem; }
.famside { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 0; }
.famside .outlook { font-size: .95rem; white-space: nowrap; }
.famside .outlook b { font-size: 1.05rem; }
.famside .outlook b.unst { color: var(--text); }
.famside .outlook b.unst small { font-size: .62rem; color: var(--brass); font-weight: 500; margin-right: 2px; }
.moonbox { display: flex; gap: 4px; padding: 3px 0 2px; }
.moonbox i { width: 15px; height: 15px; border: 1.5px solid var(--muted); border-radius: 3px; display: grid; place-items: center; font-style: normal; font-size: .7rem; line-height: 1; color: var(--brass); }
.moonbox i.done { border-color: var(--brass-dim); background: color-mix(in srgb, var(--brass) 15%, transparent); }
.moonbox i.moon { border: 2px solid var(--loss); box-shadow: 0 0 6px color-mix(in srgb, var(--loss) 50%, transparent); }
.moonbox i.moon path { stroke: var(--loss); }
.moonbox.big i { width: 22px; height: 22px; } .moonbox.big svg { width: 16px; height: 16px; } .moonbox.big { justify-content: center; }
.moonbox svg { width: 11px; height: 11px; display: block; }
.moonbox path { fill: none; stroke: var(--brass); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 0; }
.moonbox path.fresh { animation: drawCheck .6s ease-out .4s both; }
@keyframes drawCheck { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .moonbox path.fresh { animation: none; } }

.famrow .val b { font-size: 1rem; display: block; }
.famrow .val span { font-size: .66rem; font-weight: 700; }
.minis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
.minis .cell { min-height: 26px; }
.minis .cell .v { font-size: .6rem; }
.ixl { position: absolute; top: 0; left: 2px; font-size: .5rem; color: var(--muted); z-index: 1; }

/* eggs */
.eggs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
@media (min-width: 560px) { .eggs { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.egg { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; min-width: 0; }
.egg:hover:not(:disabled) { border-color: var(--brass-dim); }
.egg.rare { border-color: var(--brass-dim); background: linear-gradient(160deg, color-mix(in srgb, var(--brass) 10%, var(--panel)), var(--panel)); }
.egg .top-l { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.egg .nm { font-family: var(--f-display); font-weight: 800; font-size: .95rem; }
.egg .fee { font-size: .6rem; color: var(--muted); white-space: nowrap; }
.aff { display: flex; flex-wrap: wrap; gap: 2px 5px; font-size: .64rem; font-weight: 700; }
.aff .neg { text-decoration: line-through; opacity: .8; }

/* revenge + toolbar */
.ruinline .btn { min-height: 48px; padding: 10px 16px; }
.ruinline { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.ruinline .who { font-family: var(--f-display); font-weight: 800; font-size: .9rem; line-height: 1.2; }
.ruinline .price { font-size: 1.05rem; font-weight: 700; text-align: right; line-height: 1.1; }
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.tools .btn { padding: 8px 2px; font-size: .8rem; }

/* sheet contents */
.targets { display: grid; }
.target { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.target .ix { font-family: var(--f-display); color: var(--muted); }
.target .who { font-family: var(--f-display); font-weight: 700; }
.target .why { font-size: .7rem; color: var(--muted); }
.target.done .who { text-decoration: line-through; text-decoration-color: var(--loss); color: var(--muted); }
.target.goal { border-bottom: 2px solid var(--brass-dim); }
.log { display: flex; flex-direction: column; gap: 3px; font-size: .8rem; }
.log div { color: var(--muted); }
.log .bad { color: var(--loss); } .log .good { color: var(--gain); } .log .ruin { color: var(--brass); font-family: var(--f-display); } .log .moon { color: var(--text); }
.log b { font-weight: 400; color: var(--brass-dim); margin-right: 6px; }
.rules h3 { font-size: .92rem; margin-top: 12px; color: var(--brass); }
.rules p, .rules li { font-size: .82rem; }
.rules ul, .rules ol { padding-left: 1.2em; margin: 6px 0; }
.legend { display: grid; gap: 3px; font-size: .8rem; }
.legend b { font-family: var(--f-display); margin-right: 5px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: .74rem; width: 100%; min-width: 460px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; font-variant-numeric: tabular-nums; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-weight: 500; }
.chip { font-size: .7rem; padding: 0 5px; border-radius: 3px; background: var(--panel2); white-space: nowrap; }
.fam-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fam-big b { font-size: 1.7rem; }
.spark { width: 100%; height: 44px; display: block; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--gain); }
.bar .fill.dn { background: var(--loss); }
.bar .cut { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--loss); }
.bar .base { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); }
.tag { font-size: .66rem; color: var(--brass); border: 1px solid var(--brass-dim); border-radius: 3px; padding: 0 5px; white-space: nowrap; font-family: var(--f-body); font-weight: 400; }

.sticky-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); margin-inline: -12px; padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); box-shadow: 0 6px 12px -6px rgba(0,0,0,.7); }
body { padding-block-start: 0; }
.flavor { font-family: var(--f-display); font-size: .9rem; line-height: 1.7; color: var(--text); text-align: center; opacity: .9; }
.stat.warn { border-top: 2px solid var(--loss); background: color-mix(in srgb, var(--loss) 12%, transparent); border-radius: 0 0 4px 4px; padding-inline: 4px; }
.stat.warn .v, .stat.warn .k, .stat.warn .s { color: var(--loss); }
.stat.okpay { border-top: 2px solid var(--gain); background: color-mix(in srgb, var(--gain) 12%, transparent); border-radius: 0 0 4px 4px; padding-inline: 4px; }
.stat.okpay .v, .stat.okpay .k, .stat.okpay .s { color: var(--gain); }
.stat.alarm { background: color-mix(in srgb, var(--loss) 26%, transparent); animation: alarm 1.2s ease-in-out infinite; }
@keyframes alarm { 50% { background: color-mix(in srgb, var(--loss) 8%, transparent); } }
@media (prefers-reduced-motion: reduce) { .stat.okpay { border-top: 2px solid var(--gain); background: color-mix(in srgb, var(--gain) 12%, transparent); border-radius: 0 0 4px 4px; padding-inline: 4px; }
.stat.okpay .v, .stat.okpay .k, .stat.okpay .s { color: var(--gain); }
.stat.alarm { animation: none; } }
.dock .btn.moon { background: var(--loss); border-color: var(--loss); color: #1a0a0c; letter-spacing: .04em; font-size: .92rem; }
/* last night */
.lastnight { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: .78rem; display: flex; flex-direction: column; gap: 2px; }
.lastnight .card { font-family: var(--f-display); font-weight: 700; }
.lastnight .chg { display: flex; flex-wrap: wrap; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.eff { font-weight: 700; margin-left: 4px; }
[data-omen] { cursor: pointer; }
/* transfer: familiar ⇄ hand */
.xfer { display: grid; grid-template-columns: minmax(0, .9fr) minmax(72px, .8fr) minmax(0, 1.25fr); gap: 6px; align-items: center; padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
.xside { text-align: center; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; }
.xside .lbl { font-size: .68rem; color: var(--muted); line-height: 1.3; }
.xside .big2 { font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 2px 0; }
.xside { position: relative; }
.xside .big2 { padding-bottom: 6px; }
.xside .was { position: absolute; left: 7px; bottom: 5px; display: flex; align-items: flex-end; gap: 1px; font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; }
.xside .was s { text-decoration-thickness: 1.5px; }
.xside .was svg { width: 18px; height: 11px; margin-bottom: 4px; }
.xside .was path { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.xside.main { border-color: var(--brass-dim); background: color-mix(in srgb, var(--brass) 8%, var(--panel2)); padding: 12px 4px; }
.xside.main .big2 { font-size: 2.6rem; }
.xside.main .lbl { color: var(--text); font-size: .74rem; }
.xside .lbl2 { font-size: .62rem; color: var(--muted); margin-top: 1px; }
.xside.meet { border-color: color-mix(in srgb, var(--gain) 55%, var(--line)); background: color-mix(in srgb, var(--gain) 10%, var(--panel2)); }
.xside.meet .big2, .xside.meet .lbl2 { color: var(--gain); }
.xside.plain .big2 { color: var(--text); }
.xside.gain .big2 { color: var(--gain); } .xside.lose .big2 { color: var(--loss); }
.xmid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.xmid .amt { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.xmid .note { font-size: .62rem; color: var(--muted); text-align: center; line-height: 1.3; }
.track { position: relative; width: 100%; height: 12px; }
.track .rail { position: absolute; inset: 3px 8px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track .flow { position: absolute; top: 0; bottom: 0; width: 60%; left: 0; }
.track.right .flow { background: linear-gradient(90deg, transparent, var(--c)); animation: flowR 1s linear infinite; }
.track.left .flow { background: linear-gradient(270deg, transparent, var(--c)); animation: flowL 1s linear infinite; }
.track.right .rail { margin-right: 4px; } .track.left .rail { margin-left: 4px; }
.track.right::after, .track.left::before { content: ''; position: absolute; top: -2px; border: 8px solid transparent; }
.track.right::after { right: -6px; border-left-color: var(--c); }
.track.left::before { left: -6px; border-right-color: var(--c); }
.track.none .rail { opacity: .5; }
@keyframes flowR { from { transform: translateX(-100%); } to { transform: translateX(170%); } }
@keyframes flowL { from { transform: translateX(170%); } to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .track .flow { animation: none; width: 100%; } }
/* amount stepper */
.bigline { text-align: center; display: flex; flex-direction: column; gap: 2px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.bigline .lbl { font-size: .74rem; color: var(--muted); }
.bigline .big { font-size: 2.2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.bigline .big small { font-size: 1rem; color: var(--muted); font-weight: 400; margin: 0 6px; }
.bigline .note { font-size: .82rem; }
.stepper { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 6px; align-items: center; }

<div class="wrap">
  <div class="sticky-top">
  <header class="top">
    <div class="title-row"><h1>亡国の王女</h1><span class="night num" id="night"></span></div>
    <div class="stats" id="stats"></div>
    <div class="health" id="health"></div>
  </header>

  <div class="lastnight" id="lastNight" hidden></div>
  </div>

  <section>
    <h2>帝国の気配 <small>毎夜、この5つのうちどれかが起きる</small></h2>
    <div class="omtable" id="omens"></div>
    <div class="omen-note" id="omenNote"></div>
  </section>

  <section>
    <h2>使い魔 <small>タップで餌・回収。3体まで</small></h2>
    <div class="famlist" id="fams"></div>
  </section>


  <div class="tools">
    <button class="btn" data-panel="howto">遊び方</button>
    <button class="btn" data-panel="targets">復讐の名簿</button>
    <button class="btn" data-panel="ledger">悪魔の帳簿</button>
    <button class="btn" data-panel="log">記録</button>
  </div>
  <div class="tools" style="grid-template-columns:1fr"><button class="btn" data-panel="rules">ルールブック（確率はすべて公開）</button></div>
</div>

<aside class="drawer" id="drawer" aria-label="卵">
  <button class="drawer-tab" data-drawer="drawer" aria-expanded="false"><span class="tri">◀</span><span class="tab-txt">卵</span></button>
  <div class="drawer-body">
    <h2>卵 <small>タップで孵す。色は喰う恐怖</small></h2>
    <div class="eggs" id="eggs"></div>
  </div>
</aside>
<aside class="drawer" id="drawerRuin" aria-label="破滅">
  <button class="drawer-tab" data-drawer="drawerRuin" aria-expanded="false"><span class="tri">◀</span><span class="tab-txt">破<br>滅</span></button>
  <div class="drawer-body">
    <h2>破滅 <small>一夜に一人まで</small></h2>
    <div class="ruinline" id="ruinBox"></div>
  </div>
</aside>
<div class="dock"><button class="btn primary" id="endTurn">夜を越す</button></div>
<div id="layer"></div>

<script>
/* 亡国の王女 — game engine (pure logic, no DOM) */
(function (root) {
  'use strict';

  // 4つの恐怖（＝投資先の4分野）
  const SECTORS = ['war', 'plague', 'life', 'power'];
  const SECT_JP = { war: '戦', plague: '疫', life: '飢', power: '罰' };
  const SECT_DESC = {
    war: '戦への恐怖。徴兵や敗戦の噂で高まり、和平で鎮まる',
    plague: '疫病への恐怖。流行で高まり、薬師の到来で鎮まる',
    life: '飢えへの恐怖。重税や麦の高騰で高まり、豊作で鎮まる',
    power: '罰への怯え。魔女狩りや粛清で高まる'
  };

  // 使い魔の種族（実在の金融商品がモチーフ）
  // basic: 最初から選べる4種（4つの恐怖に1対1）。それ以外は第5夜から悪魔が持ってくる。
  const SPECIES = {
    crow:   { name: '鴉',       motif: '景気敏感株', basic: true, fee: 2, sens: { war: 1, life: .1 },
              desc: '戦の恐怖を喰う。遠征期に大きく育ち、和平で痩せる。' },
    rat:    { name: '鼠',       motif: '新興・小型株', basic: true, fee: 1, sens: { plague: 1.6, life: .1 }, exoWeak: 1.4,
              desc: '疫病の恐怖を喰う。当たれば化けるが振れが激しく、騎士団にも弱い。' },
    locust: { name: '蝗',       motif: '生活必需品株', basic: true, fee: 1, sens: { life: .5, plague: .1 }, exoResist: .5,
              desc: '飢えの恐怖を喰う。振れが小さく、騎士団の被害も半分。' },
    shadow: { name: '影法師',    motif: '防衛・警備株', basic: true, fee: 2, sens: { power: .5 }, inverse: true, decay: .02,
              desc: '罰への怯えを喰う。騎士団が動くほど太り、他の使い魔と逆に動く。毎夜2%痩せる。' },
    moth:   { name: '蛾',       motif: 'インデックス投信', fee: 1, sens: { war: .35, plague: .35, life: .35, power: .35 },
              desc: '群れで4つの恐怖すべてを薄く広く喰う。大きく外れない。' },
    bee:    { name: '蜂',       motif: '高配当株', fee: 2, sens: { life: .3, war: .1 }, yield: .03,
              desc: '毎夜、蓄えの3%を欠片にして運んでくる。本体は育ちにくい。' },
    snake:  { name: '蛇',       motif: '債券', fee: 1, bond: { turns: 6, rate: .15 },
              desc: '札の影響を受けず地下で眠る。6夜後に蓄え×1.15で目覚める。途中で起こすと2割減。' },
    gold:   { name: '金色の蜥蜴', motif: '金（ゴールド）', fee: 2, sens: { war: .25, plague: .3, power: .35, life: -.3 }, exoResist: 1,
              desc: '戦・疫・罰で帝国が荒れると値を上げる。飢えの時期は民が金を手放すので沈む。騎士団に狩られない。' },
    wolf:   { name: '双頭の狼',  motif: 'レバレッジETF', fee: 2, sens: { war: 2, life: .2 }, decay: .03,
              desc: '鴉の2倍の振れ幅。毎夜3%痩せる。短期決戦向け。' }
  };
  const SPECIES_KEYS = Object.keys(SPECIES);
  const BASIC_KEYS = SPECIES_KEYS.filter(k => SPECIES[k].basic);
  const RARE_KEYS = SPECIES_KEYS.filter(k => !SPECIES[k].basic);

  // 場札（帝国の気配）。値は「その恐怖が何割増えるか」
  const CARDS = {
    grain:      { name: '麦の値上がり',   fx: { life: .15 } },
    tax:        { name: '重税の布告',     fx: { life: .2, power: .03 } },
    sleepless:  { name: '眠れぬ夜',       fx: { war: .04, plague: .04, life: .04, power: .04 } },
    omen:       { name: '凶星が昇る',     fx: { war: .06, plague: .06, life: .06, power: .06 } },
    rumor:      { name: '不穏な噂',       split: ['rumorGood', 'patrolLife'] },
    rumorGood:  { name: '噂が飢えを煽る', fx: { life: .2 }, hiddenInDeck: true },
    harvest:    { name: '豊作の報せ',     fx: { life: -.3 } },
    march:      { name: '出征の行列',     fx: { war: .25, life: .03 } },
    conscript:  { name: '徴兵令',         fx: { war: .32, life: -.08 } },
    letter:     { name: '前線からの密書', split: ['letterGood', 'letterBad'] },
    letterGood: { name: '敗走の報せ',     fx: { war: .32 }, hiddenInDeck: true },
    letterBad:  { name: '休戦の報せ',     fx: { war: -.3 }, hiddenInDeck: true },
    peace:      { name: '和平の噂',       fx: { war: -.3 } },
    plague:     { name: '疫病の流行',     fx: { plague: .42, life: -.05 } },
    quarantine: { name: '隔離令',         fx: { plague: .2, life: -.1 } },
    healer:     { name: '薬師の到来',     fx: { plague: -.35 } },
    edict:      { name: '魔女狩りの布告', fx: { power: .25, life: -.05 } },
    patrolWar:    { name: '騎士団の巡回（戦）', exo: { target: 'war', e: -.55 } },
    patrolPlague: { name: '騎士団の巡回（疫）', exo: { target: 'plague', e: -.55 } },
    patrolLife:   { name: '騎士団の巡回（飢）', exo: { target: 'life', e: -.55 } },
    patrolPower:  { name: '騎士団の巡回（罰）', exo: { target: 'power', e: -.55 } },
    inquisition:  { name: '異端審問',           exo: { target: 'all', e: -.22 } },
    // 繁栄期：民の恐怖が消える（使い魔にとっての恐慌）。宴の夜は宮廷の警護が緩む。
    founding:   { name: '建国祭',         fx: { war: -.12, plague: -.12, life: -.12, power: -.12 }, lax: true },
    feast:      { name: '戦勝の祝宴',     fx: { war: -.25, life: -.1 }, lax: true },
    amnesty:    { name: '皇帝の恩赦',     fx: { power: -.35 } },
    clinic:     { name: '施療院の開設',   fx: { plague: -.3 } },
    bounty:     { name: '大豊作',         fx: { life: -.3, plague: -.05 } }
  };

  // 情勢ごとの山札の構成（重み）。ルールブックで全公開。今の情勢だけ非公開。
  const REGIMES = {
    tax:    { name: '重税', deck: { grain: 4, tax: 3, sleepless: 4, omen: 2, rumor: 3, march: 1, harvest: 1, peace: 1, patrolLife: 1, patrolWar: 1 } },
    war:    { name: '遠征', deck: { march: 4, conscript: 3, letter: 3, peace: 1, patrolWar: 2, grain: 1, omen: 1 } },
    plague: { name: '疫病', deck: { plague: 4, quarantine: 3, healer: 2, patrolPlague: 2, rumor: 1, inquisition: 1, sleepless: 1 } },
    purge:  { name: '粛清', deck: { edict: 3, patrolWar: 2, patrolPlague: 2, patrolLife: 2, patrolPower: 1, inquisition: 2, rumor: 1 } },
    boom:   { name: '繁栄', deck: { founding: 4, feast: 3, amnesty: 2, clinic: 2, bounty: 2, peace: 1, omen: 1, rumor: 1 } }
  };
  const REGIME_KEYS = Object.keys(REGIMES);
  const STAY = 0.8; // 情勢が続く確率。変わる時は残り4つに等分。

  // 帝国の要人（破滅の順番）
  const TARGETS = [
    { name: '占領地総督 グラム', title: '王都を焼いた男' },
    { name: '聖堂騎士団長 イーヴァ', title: '王家の礼拝堂を焼いた' },
    { name: '将軍 バルトロ', title: '城門を破り、兄を討った' },
    { name: '宰相 メルヴィル', title: '侵略を計画した' },
    { name: '皇帝 ヴァルディス', title: 'すべての始まり' }
  ];

  const P = {
    startShards: 30,
    startDebt: 30,
    moonEvery: 4,
    moonInterest: .08,
    payRate: .2,
    payMin: 5,
    latePenalty: .5,
    lateShorten: 2,
    borrowRate: 1.5,
    borrowShorten: 2,
    debtCap: 90,
    marginLine: .4,
    deathMin: 20,
    deathMax: 28,
    ruinStart: 10,
    ruinDrift: .03,
    ruinNoise: .05,
    ruinStep: .08,
    exoDiscount: .8,
    winRuins: 5,
    fieldSize: 5,
    slots: 3,
    eggs: 3,
    recoverFee: .05,
    lossCut: 0, // 0 = ロスカットなし
    scoutCost: 2,
    minFeed: 1,
    boom: 2,
    rareFrom: 5
  };

  function mkRng(seed) {
    if (seed == null) return Math.random;
    let s = seed >>> 0;
    return function () { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function pickWeighted(rng, w) {
    let tot = 0; for (const k in w) tot += w[k];
    let r = rng() * tot;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return Object.keys(w)[0];
  }
  const r1 = x => Math.round(x * 10) / 10;

  function lateMult(turn) { return 1 + (turn - 1) / 25; }
  function publicChance(turn) { return Math.max(.15, .8 - turn * .028); }

  function newGame(seed) {
    const rng = mkRng(seed);
    const s = {
      rng, turn: 1, shards: P.startShards, debt: P.startDebt,
      deathTurn: P.deathMin + Math.floor(rng() * (P.deathMax - P.deathMin + 1)),
      regime: 'tax', regimeHistory: ['tax'],
      field: [], eggs: [], fams: [], famSeq: 0,
      ruinPrice: P.ruinStart, ruined: 0, ruinedThisTurn: false,
      log: [], over: false, result: null,
      stats: { lossCutLost: 0, missedByCut: 0, fees: 0, borrowed: 0, latePays: 0, cutEarly: 0, worstHold: null, peakShards: P.startShards, lossCuts: [] },
      lastDraw: null
    };
    for (let i = 0; i < P.fieldSize; i++) s.field.push(drawCard(s, true));
    rollEggs(s);
    s.log.push({ t: 1, kind: 'story', text: '国が落ちた夜、幼い王女は悪魔と契約した。命が尽きる前に、帝国に報いを。' });
    return s;
  }

  function drawCard(s, initial) {
    const key = pickWeighted(s.rng, REGIMES[s.regime].deck);
    const pub = s.rng() < (initial ? .8 : publicChance(s.turn));
    return { key, public: pub, born: s.regime };
  }

  function rollEggs(s) {
    s.eggs = BASIC_KEYS.slice();
    if (s.turn >= P.rareFrom) s.eggs.push(RARE_KEYS[Math.floor(s.rng() * RARE_KEYS.length)]);
  }

  // 1枚の札（split解決済み）が、ある種族の蓄えを何割動かすか（後半倍率込み）
  function cardEffectOn(cardKey, spKey, turn) {
    const c = CARDS[cardKey], sp = SPECIES[spKey];
    const m = lateMult(turn);
    if (sp.bond) return 0;
    if (c.fx) {
      let ch = 0;
      for (const k in c.fx) ch += (sp.sens[k] || 0) * c.fx[k] * (c.fx[k] > 0 ? P.boom : 1);
      return ch * m;
    }
    if (c.exo) {
      if (sp.inverse) return -c.exo.e * .4 * m;
      let exp;
      if (c.exo.target === 'all') exp = .6;
      else exp = Math.min(1, Math.max(0, sp.sens[c.exo.target] || 0));
      exp *= (sp.exoWeak || 1) * (1 - (sp.exoResist || 0));
      return c.exo.e * exp * m;
    }
    return 0;
  }
  // 札（splitなら両方の結果）を返す
  function outcomes(cardKey) {
    const c = CARDS[cardKey];
    return c.split ? c.split.map(k => ({ key: k, p: .5 })) : [{ key: cardKey, p: 1 }];
  }
  function isExo(cardKey) { return !!CARDS[cardKey].exo; }

  function nextPayment(s) {
    const d = s.debt * (1 + P.moonInterest);
    return Math.min(Math.ceil(d), Math.max(P.payMin, Math.ceil(d * P.payRate)));
  }
  function nightsToMoon(s) { return P.moonEvery - ((s.turn - 1) % P.moonEvery); }

  const SYMPTOMS = ['落ち着いている', 'ときどき咳き込む', '熱が下がらない', '咳に血が混じる', '指先が冷たく、もう温まらない'];
  function symptom(s) {
    const left = s.deathTurn - s.turn;
    const lv = left > 14 ? 0 : left > 10 ? 1 : left > 6 ? 2 : left > 3 ? 3 : 4;
    return { lv, text: SYMPTOMS[lv] };
  }

  // ---------- 行動 ----------
  function err(msg) { return { ok: false, msg }; }

  function hatch(s, eggIdx, amount) {
    if (s.over) return err('ゲームは終わっています');
    const sp = s.eggs[eggIdx]; if (!sp) return err('卵がありません');
    if (s.fams.length >= P.slots) return err('使い魔は3体までです。誰かを回収して枠を空けてください');
    amount = Math.floor(amount);
    const fee = SPECIES[sp].fee;
    if (amount < P.minFeed) return err(`最初の餌は${P.minFeed}以上必要です`);
    if (amount + fee > s.shards) return err('欠片が足りません');
    s.shards -= amount + fee; s.stats.fees += fee;
    const f = { id: ++s.famSeq, sp, value: amount, invested: amount, born: s.turn, warn: null, peak: amount, history: [amount] };
    s.fams.push(f);
    if (!SPECIES[sp].basic) s.eggs.splice(eggIdx, 1);
    s.log.push({ t: s.turn, kind: 'act', text: `${SPECIES[sp].name}を孵した（代価${fee}・餌${amount}）` });
    return { ok: true };
  }

  function feed(s, famId, amount) {
    if (s.over) return err('ゲームは終わっています');
    const f = s.fams.find(x => x.id === famId); if (!f) return err('使い魔がいません');
    amount = Math.floor(amount);
    if (amount < 1) return err('1以上を指定してください');
    if (amount > s.shards) return err('欠片が足りません');
    if (SPECIES[f.sp].bond) return err('眠っている蛇には餌を与えられません');
    s.shards -= amount; f.value += amount; f.invested += amount;
    s.log.push({ t: s.turn, kind: 'act', text: `${SPECIES[f.sp].name}に欠片${amount}を与えた` });
    return { ok: true };
  }

  function recoverPreview(s, famId, amount) {
    const f = s.fams.find(x => x.id === famId); if (!f) return null;
    amount = Math.min(f.value, amount);
    const sp = SPECIES[f.sp];
    let fee = P.recoverFee;
    if (sp.bond && s.turn - f.born < sp.bond.turns) fee = .2;
    const get = Math.floor(amount * (1 - fee) * 10) / 10;
    const all = amount >= f.value - 0.05;
    const share = amount / f.value;
    const realized = (amount * (1 - fee)) - f.invested * share; // 確定損益
    return { get, fee, all, realized: r1(realized) };
  }

  function recover(s, famId, amount) {
    if (s.over) return err('ゲームは終わっています');
    const f = s.fams.find(x => x.id === famId); if (!f) return err('使い魔がいません');
    if (amount <= 0) return err('量を指定してください');
    const pv = recoverPreview(s, famId, amount);
    amount = Math.min(f.value, amount);
    const share = amount / f.value;
    s.shards = r1(s.shards + pv.get);
    s.stats.fees += r1(amount - pv.get);
    if (pv.all) {
      s.fams = s.fams.filter(x => x !== f);
      if (pv.realized < 0) s.stats.cutEarly++;
      s.log.push({ t: s.turn, kind: pv.realized < 0 ? 'bad' : 'good', text: `${SPECIES[f.sp].name}を喰らった。欠片${pv.get}を回収（確定${pv.realized >= 0 ? '+' : ''}${pv.realized}）` });
    } else {
      f.value = r1(f.value - amount); f.invested = r1(f.invested * (1 - share));
      s.log.push({ t: s.turn, kind: 'act', text: `${SPECIES[f.sp].name}から欠片${pv.get}を吸い上げた` });
    }
    return { ok: true, got: pv.get };
  }

  // 手元に受け取る量（net）で指定する回収。目減り分は使い魔の蓄えから余分に差し引く。
  function feeOf(s, f) { const sp = SPECIES[f.sp]; return sp.bond && s.turn - f.born < sp.bond.turns ? .2 : P.recoverFee; }
  function maxNet(s, famId) { const f = s.fams.find(x => x.id === famId); return f ? Math.floor(f.value * (1 - feeOf(s, f)) * 10) / 10 : 0; }
  function withdrawPreview(s, famId, net) {
    const f = s.fams.find(x => x.id === famId); if (!f) return null;
    const fee = feeOf(s, f), mx = maxNet(s, famId);
    const all = net >= mx - 0.05;
    const get = all ? mx : net;
    const cost = all ? f.value : Math.min(f.value, net / (1 - fee));
    const share = cost / f.value;
    return { get, cost: r1(cost), fee, all, left: all ? 0 : r1(f.value - cost), realized: r1(get - f.invested * share) };
  }
  function withdraw(s, famId, net) {
    if (s.over) return err('ゲームは終わっています');
    const f = s.fams.find(x => x.id === famId); if (!f) return err('使い魔がいません');
    if (net <= 0) return err('量を指定してください');
    const pv = withdrawPreview(s, famId, net);
    s.shards = r1(s.shards + pv.get);
    s.stats.fees = r1(s.stats.fees + pv.cost - pv.get);
    if (pv.all) {
      s.fams = s.fams.filter(x => x !== f);
      if (pv.realized < 0) s.stats.cutEarly++;
      s.log.push({ t: s.turn, kind: pv.realized < 0 ? 'bad' : 'good', text: `${SPECIES[f.sp].name}を喰らった。欠片${pv.get}を回収（確定${pv.realized >= 0 ? '+' : ''}${pv.realized}）` });
    } else {
      const share = pv.cost / f.value;
      f.value = pv.left; f.invested = r1(f.invested * (1 - share));
      s.log.push({ t: s.turn, kind: 'act', text: `${SPECIES[f.sp].name}から欠片${pv.get}を吸い上げた（使い魔は${pv.cost}減った）` });
    }
    return { ok: true, got: pv.get };
  }

  function borrow(s, amount) {
    if (s.over) return err('ゲームは終わっています');
    amount = Math.floor(amount);
    if (amount < 1) return err('1以上を指定してください');
    const add = Math.ceil(amount * P.borrowRate);
    if (s.debt + add > P.debtCap) return err(`悪魔はこれ以上貸さない（借りの上限は${P.debtCap}）`);
    s.shards += amount; s.debt += add; s.stats.borrowed += amount;
    s.deathTurn -= P.borrowShorten;
    s.log.push({ t: s.turn, kind: 'bad', text: `命を担保に、悪魔から欠片${amount}を借りた（悪魔への借り+${add}）` });
    return { ok: true };
  }

  function ruin(s) {
    if (s.over) return err('ゲームは終わっています');
    if (s.ruinedThisTurn) return err('破滅は一夜に一人までです');
    if (s.ruined >= TARGETS.length) return err('もう誰も残っていません');
    const price = Math.ceil(s.ruinPrice);
    if (s.shards < price) return err('欠片が足りません');
    s.shards = r1(s.shards - price);
    const tg = TARGETS[s.ruined];
    s.ruined++; s.ruinedThisTurn = true;
    s.ruinPrice *= (1 + P.ruinStep);
    s.log.push({ t: s.turn, kind: 'ruin', text: `${tg.name}に破滅が訪れた。` });
    if (s.ruined >= TARGETS.length) finish(s, 'win');
    return { ok: true, target: tg };
  }

  function scout(s, fieldIdx) {
    if (s.over) return err('ゲームは終わっています');
    const c = s.field[fieldIdx]; if (!c) return err('札がありません');
    if (c.public) return err('すでに見えています');
    if (s.shards < P.scoutCost) return err('欠片が足りません');
    s.shards -= P.scoutCost; c.public = true; c.scouted = true;
    s.log.push({ t: s.turn, kind: 'act', text: `偵察で伏せ札を覗いた：${CARDS[c.key].name}` });
    return { ok: true };
  }

  // ---------- 夜を越す ----------
  function endTurn(s) {
    if (s.over) return err('ゲームは終わっています');
    const ev = [];
    const idx = Math.floor(s.rng() * s.field.length);
    const drawn = s.field.splice(idx, 1)[0];
    let key = drawn.key;
    const c0 = CARDS[key];
    if (c0.split) key = c0.split[s.rng() < .5 ? 0 : 1];
    s.lastDraw = { from: drawn.key, key, wasPublic: drawn.public, idx };
    ev.push({ kind: isExo(key) ? 'bad' : 'card', text: `${drawn.public ? '' : '伏せ札が開いた：'}${CARDS[drawn.key].name}${key !== drawn.key ? ` → ${CARDS[key].name}` : ''}` });

    // 使い魔の変動
    for (const f of [...s.fams]) {
      const sp = SPECIES[f.sp];
      let ch = cardEffectOn(key, f.sp, s.turn);
      if (sp.decay) ch -= sp.decay;
      ch = Math.max(-.95, ch);
      f.value = r1(Math.max(0, f.value * (1 + ch)));
      if (sp.yield && f.value > 0) {
        const y = r1(f.value * sp.yield); s.shards = r1(s.shards + y);
      }
      f.peak = Math.max(f.peak, f.value);
      f.history.push(f.value);
      f.lastChange = ch;
      if (f.warn == null && f.value < f.invested * .7) f.warn = f.value;
      if (sp.bond && s.turn + 1 - f.born >= sp.bond.turns) {
        const get = r1(f.value * (1 + sp.bond.rate));
        s.shards = r1(s.shards + get);
        s.fams = s.fams.filter(x => x !== f);
        ev.push({ kind: 'good', text: `${sp.name}が目覚め、欠片${get}を返した` });
        continue;
      }
      if (P.lossCut > 0 && f.value < f.invested * P.lossCut) {
        s.fams = s.fams.filter(x => x !== f);
        s.stats.lossCutLost += f.value;
        if (f.warn != null) s.stats.missedByCut = r1(s.stats.missedByCut + f.warn * (1 - P.recoverFee));
        s.stats.lossCuts.push({ sp: f.sp, invested: r1(f.invested), warn: f.warn, peak: f.peak, born: f.born, died: s.turn });
        ev.push({ kind: 'bad', text: `${sp.name}は騎士団に捕捉され、消滅した（注ぎ込んだ欠片${r1(f.invested)}が無に）` });
      }
    }

    // 破滅の価格
    let drift = 1 + P.ruinDrift + (s.rng() * 2 - 1) * P.ruinNoise;
    if (isExo(key)) { drift *= P.exoDiscount; ev.push({ kind: 'card', text: '騎士団が出払い、宮廷の守りが手薄になった' }); }
    else if (CARDS[key].lax) { drift *= P.exoDiscount; ev.push({ kind: 'card', text: '宴に酔い、宮廷の警護が緩んだ' }); }
    s.ruinPrice = s.ruinPrice * drift;

    // 新月の取り立て
    if ((s.turn % P.moonEvery) === 0) {
      s.debt = Math.ceil(s.debt * (1 + P.moonInterest));
      const pay = Math.min(s.debt, Math.max(P.payMin, Math.ceil(s.debt * P.payRate)));
      if (s.shards >= pay) {
        s.shards = r1(s.shards - pay); s.debt -= pay;
        ev.push({ kind: 'moon', text: `新月。悪魔に欠片${pay}を納めた` });
      } else {
        const paid = Math.floor(s.shards); const short = pay - paid;
        s.shards = r1(s.shards - paid); s.debt -= paid;
        s.debt += Math.ceil(short * P.latePenalty);
        s.deathTurn -= P.lateShorten; s.stats.latePays++;
        ev.push({ kind: 'bad', text: `新月。欠片が${short}足りず、悪魔は王女の命を喰らった` });
      }
    }

    // 情勢の推移（非公開）
    if (s.rng() >= STAY) {
      const others = REGIME_KEYS.filter(k => k !== s.regime);
      s.regime = others[Math.floor(s.rng() * others.length)];
    }
    s.regimeHistory.push(s.regime);

    // 補充・卵
    s.turn++;
    s.field.push(drawCard(s));
    rollEggs(s);
    s.ruinedThisTurn = false;
    s.stats.peakShards = Math.max(s.stats.peakShards, s.shards);

    for (const e of ev) s.log.push({ t: s.turn - 1, ...e });

    if (s.stats.borrowed > 0 && s.debt > 0 && netWorth(s) < s.debt * P.marginLine) {
      s.log.push({ t: s.turn - 1, kind: 'bad', text: '魂の総量が借りに見合わなくなった。悪魔は契約を打ち切り、王女の魂を回収した' });
      finish(s, 'margin');
    } else if (s.turn > s.deathTurn) finish(s, s.ruined >= P.winRuins ? 'win' : 'lose');
    return { ok: true, events: ev, drawn: s.lastDraw };
  }

  function finish(s, result) {
    s.over = true; s.result = result;
    s.stats.leftover = r1(s.shards + s.fams.reduce((a, f) => a + f.value, 0));
  }

  function netWorth(s) { return r1(s.shards + s.fams.reduce((a, f) => a + f.value, 0)); }

  const API = { SECTORS, SECT_JP, SECT_DESC, SYMPTOMS, SPECIES, SPECIES_KEYS, BASIC_KEYS, RARE_KEYS, CARDS, REGIMES, REGIME_KEYS, STAY, TARGETS, P,
    newGame, hatch, feed, recover, recoverPreview, withdraw, withdrawPreview, maxNet, borrow, ruin, scout, endTurn,
    cardEffectOn, outcomes, isExo, nextPayment, nightsToMoon, symptom, netWorth, lateMult, publicChance, mkRng };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.Engine = API;
})(this);

      <h3>お金まわり</h3>
      <ul><li>回収（売却）は一部でも全部でも可能。受け取りは5%目減りする。全部回収するとその使い魔は消え、枠が空く。使い魔は3体まで。</li>
      <li>破滅の代価は毎夜およそ3%ずつ上がる（±5%のぶれ）。騎士団の札や、宴の札（建国祭・戦勝の祝宴）が起きた夜は2割下がる。</li>

  }
  function openPanel(name) { const [t, h] = PANELS[name](); panel(t, h); }

  // 使い魔の操作：＋で注ぎ込む、−で回収する（ひとつの操作）
  function famPanel(id) {

    const sp = E.SPECIES[f.sp], pl = f.value - f.invested;

      min: -mx, max: canFeed, value: 0, unit: '移動する数',
      quick: [['全回収', () => -mx], ['半回収', () => -Math.floor(mx / 2)], ['0', () => 0], ['全て注ぐ', m => m]],
      ok: v => v > 0 ? `魂の欠片を ${fmt(v)} 注ぎ込む` : v < 0 ? `魂の欠片を ${fmt(-v)} 回収する` : '',

        const p = E.withdrawPreview(S, id, -v); if (!p) return '';

      },
      preview: v => v < 0 ? (sp.bond ? '蛇は満期前に起こすと2割減る' : '') : v > 0 ? '注いだ分だけ、育つ時も痩せる時も振れ幅が大きくなる' : (sp.bond ? '眠っている蛇には注ぎ込めない。回収はできる' : ''),
      run: v => v > 0 ? E.feed(S, id, v) : E.withdraw(S, id, -v) });
  }
  function spark(hist, invested) {
    const w = 200, h = 44, pad = 3, vals = hist.length > 1 ? hist : [hist[0], hist[0]];
    const max = Math.max(invested, ...vals) * 1.05;
    const x = i => pad + i * (w - 2 * pad) / (vals.length - 1), y = v => h - pad - v / max * (h - 2 * pad);
    const last = vals[vals.length - 1], col = last >= invested ? 'var(--gain)' : 'var(--loss)';
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" x2="${w}" y1="${y(invested)}" y2="${y(invested)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
      <polyline points="${vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function sheet(opts) {

    upd();
  }
  // 左＝使い魔、右＝手元。dir: 'left'（手元→使い魔）| 'right'（使い魔→手元）| 'none'
  function xferHTML(o) {

      ${side(o.rLbl, o.rCur, o.rTo, (o.dir === 'right' ? 'gain' : o.dir === 'left' ? 'lose' : '') + ' main')}</div>${o.extra ? `<div class="bigline" style="border:0;padding:0">${o.extra}</div>` : ''}`;
  }
  const bigNum = (lbl, from, to, note) => `<div class="lbl">${lbl}</div><div class="big">${fmt(from)}<small>→</small>${to}</div>${note ? `<div class="note">${note}</div>` : ''}`;
  function openHatch(i) {
    const k = S.eggs[i], sp = E.SPECIES[k], max = Math.floor(S.shards);

    lines.push(`代価と目減りで悪魔に渡った欠片：${fmt(st.fees)}`);
    if (st.borrowed) lines.push(`命を担保に借りた欠片：${st.borrowed}`);
    if (st.latePays) lines.push(`<span class="hl">取り立てを払えなかった新月：${st.latePays}回（そのたび命が2夜縮んだ）</span>`);
    lines.push(`使われずに残った欠片と使い魔：${fmt(st.leftover)}`);
    const strip = S.regimeHistory.slice(0, S.turn - 1).map((r, i) => `<span class="rg-${r}" title="${i + 1}夜 ${E.REGIMES[r].name}">${E.REGIMES[r].name[0]}</span>`).join('');
    layer.innerHTML = `<div class="scrim center"><div class="night-card end" role="dialog" aria-modal="true">
      <h3>${title}</h3><div class="verdict">${verdict}</div>
      <div class="answers">${lines.map(l => `<div>${l}</div>`).join('')}</div>
      <div><div class="sub" style="margin-bottom:4px">本当の情勢の移り変わり（1夜目から）</div><div class="regime-strip">${strip}</div>
      <div class="sub" style="margin-top:4px">重＝重税　遠＝遠征　疫＝疫病　粛＝粛清　繁＝繁栄</div></div>
      <button class="btn primary" id="again">もう一度、契約する</button></div></div>`;
    $('again').onclick = () => { S = E.newGame(); newCardIdx = -1; lastNight = null; close(); render(); window.scrollTo(0, 0); };
  }

  document.addEventListener('click', e => {
    const om = e.target.closest('[data-omen]');
    if (om && !e.target.closest('button:not(.famrow)') && !om.closest('.famrow')) { omenPanel(+om.dataset.omen); return; }
    const t = e.target.closest('button'); if (!t || t.disabled) return;
    if (t.dataset.hatch != null) openHatch(+t.dataset.hatch);
    else if (t.dataset.fam != null) famPanel(+t.dataset.fam);
    else if (t.dataset.scout != null) { E.scout(S, +t.dataset.scout); render(); }
    else if (t.dataset.panel != null) openPanel(t.dataset.panel);
    else if (t.dataset.openDrawer) setDrawer('drawer', true);
    else if (t.id === 'ruinBtn') doRuin();
    else if (t.id === 'borrowBtn') openBorrow();
    else if (t.id === 'endTurn') { if (!S.over) nightEnd(); else showEnd(); }
  });
  function setDrawer(id, open) {
    document.querySelectorAll('.drawer').forEach(d => {
      const o = d.id === id ? open : false;
      d.classList.toggle('open', o); d.querySelector('.drawer-tab').setAttribute('aria-expanded', o);
    });
    document.body.classList.toggle('drawer-on', !!open);

  }
  let tabLock = 0;
  document.querySelectorAll('.drawer-tab').forEach(t => t.onclick = e => {
    e.stopPropagation();
    if (Date.now() < tabLock) return;   // 連打・ゴーストタップで別のタブが開かないように
    tabLock = Date.now() + 450;
    setDrawer(t.dataset.drawer, !$(t.dataset.drawer).classList.contains('open'));
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML && !S.over) close(); });

  render();
  openPanel('howto');
})();
</script>

</body>
</html>
